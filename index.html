<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>traquetines</title>
    <!-- Fuentes desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    
    <style>
        /* Reseteo global */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Fondo negro puro absoluto y centrado */
        body {
            font-family: 'MedievalSharp', cursive;
            background-color: #000000 !important;
            color: #ffffff !important;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        /* Título Gótico Principal "traquetines" */
        header {
            margin-bottom: 30px;
            text-align: center;
        }

        .gothic-title {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 3.5rem;
            font-weight: normal;
            color: #ffffff;
            letter-spacing: 2px;
            cursor: pointer;
        }

        /* Clases de colores aleatorios para las 4 letras */
        .color-red { color: #ff3333 !important; text-shadow: 0 0 8px rgba(255, 51, 51, 0.4); }
        .color-yellow { color: #ffd700 !important; text-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }
        .color-green { color: #33cc66 !important; text-shadow: 0 0 8px rgba(51, 204, 102, 0.4); }
        .color-blue { color: #3399ff !important; text-shadow: 0 0 8px rgba(51, 153, 255, 0.4); }

        /* Cuadrícula de 12 miniaturas en 2 columnas */
        .gallery-section {
            width: 100%;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .grid-item {
            aspect-ratio: 1 / 1;
            background-color: #0a0a0a;
            border: 1px solid #222222;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: border-color 0.2s, transform 0.2s;
        }

        .grid-item:hover {
            border-color: #ffffff;
            transform: scale(1.03);
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(115%) brightness(90%);
        }

        /* Vista de Detalle del Programa (Oculta por defecto) */
        .detail-view {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        .detail-view.active {
            display: flex;
        }

        /* Título del programa en detalle */
        .detail-title {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 2.4rem;
            color: #ffffff;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Contenedor principal de texto */
        .detail-content {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Estilo de los párrafos de texto con la imagen flotando en su interior */
        .detail-paragraph {
            font-family: 'MedievalSharp', cursive;
            font-size: 1.0rem;
            line-height: 1.2;
            color: #cccccc;
            letter-spacing: 0.2px;
            text-align: justify;
            text-justify: inter-word;
            overflow: hidden; /* Contiene los elementos flotados dentro del párrafo */
        }
/* Efecto de Letra Capitular (Estilo miniatura / códice medieval) */
        .detail-paragraph::first-letter {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 3rem;
            float: left;
            line-height: 0.8;
            padding-top: 4px;
            padding-right: 8px;
            padding-bottom: 0px;
            color: #ffffff;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
        }
        /* Bloque de imagen flotada dentro del párrafo */
        .inline-image-block {
            display: inline-block;
            max-width: 42%;
        }

        .float-left {
            float: left;
            margin-right: 12px;
            margin-bottom: 4px;
        }

        .float-right {
            float: right;
            margin-left: 12px;
            margin-bottom: 4px;
        }

        .inline-image-block img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border: 1px solid #333333;
            border-radius: 4px;
            filter: contrast(115%) brightness(90%);
            display: block;
        }

        /* Pie de foto ajustado al ancho de la imagen */
        .inline-caption {
            font-family: 'MedievalSharp', cursive;
            font-size: 0.75rem;
            color: #777777;
            letter-spacing: 0.5px;
            text-align: justify;
            margin-top: 4px;
            display: block;
            line-height: 1.1;
        }

        /* Botón de regreso */
        .back-btn {
            background: transparent;
            border: 1px solid #444444;
            color: #aaaaaa;
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 1.1rem;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
        }

        /* Pie de página */
        footer {
            margin-top: 40px;
            text-align: center;
        }

        .footer-text {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 1rem;
            color: #555555;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Título Gótico Principal con letras dinámicas -->
        <header>
            <h1 class="gothic-title" id="main-title">traquetines</h1>
        </header>

        <!-- SECCIÓN 1: Cuadrícula General -->
        <section id="gallery-section" class="gallery-section">
            <div id="image-grid" class="image-grid"></div>
        </section>

        <!-- SECCIÓN 2: Vista de Detalle del Programa -->
        <section id="detail-section" class="detail-view">
            <h2 id="detail-program-title" class="detail-title"></h2>
            
            <!-- Contenedor dinámico -->
            <div id="detail-content-container" class="detail-content"></div>
            
            <button id="back-to-grid" class="back-btn">← Volver</button>
        </section>

    </div>

    <!-- Pie de página -->
    <footer>
        <p class="footer-text">Hecho con profunda irreverencia</p>
    </footer>

    <!-- Elemento de audio global -->
    <audio id="audio-stream" preload="metadata"></audio>

    <script>
        // Lista de programas con párrafos que pueden contener opcionalmente una imagen integrada
        const playlist = [
            {
                title: "Programa 1: prueba inútil",
                src: "music/schiarazula.mp3",
                thumbnail: "images/1.jpg", 
                content: [
                    {
                        text: "En este primer capítulo exploramos las danzas instrumentales de la baja edad media, donde los juglares recorrían los burgos interpretando estampies a los pies de las murallas. Los bellatores o guerreros eran la nobleza, cuya función era la protección física, la defensa de todos ante las agresiones e injusticias. Estaba organizada piramidalmente desde el emperador, pasando por los reyes y descendiendo sin solución de continuidad hasta el último escudero, aunque atendiendo a su rango, poder y riqueza puede clasificarse en dos partes diferenciadas: alta nobleza (marqueses, condes y duques) cuyos feudos tienen el tamaño de regiones y provincias (aunque la mayor parte de las veces no en continuidad territorial, sino repartido y difuso, lleno de enclaves y exclaves); y la baja nobleza o caballeros (barones, infanzones), cuyos feudos son del tamaño de pequeñas comarcas (a escala municipal o inferior a la municipal), o directamente no poseen feudos territoriales, viviendo en los castillos de señores más importantes, o en ciudades o poblaciones en las que no ejercen jurisdicción (aunque sí pueden ejercer su regimiento, es decir, participar en su gobierno municipal en representación del estado noble). A finales de la Edad Media y en la Edad Moderna, cuando la nobleza ya no ejercía su función militar, como era el caso de los hidalgos españoles, que aducían sus privilegios estamentales para evitar el pago de impuestos y obtener alguna ventaja social, alardeando de ejecutoria o de blasón y casa solariega, pero que al no disponer de rentas feudales suficientes para mantener la manera de vida nobiliaria, corrían el peligro de perder su condición por contraer un matrimonio desigual o ganarse la vida trabajando.",
                        image: {
                            url: "images/13.jpg",
                            caption: "Ritter Hiltbolt von Schwangau, un noble que resulta era caballero",
                            float: "left" // 'left' o 'right'
                        }
                    },
                    {
                        text: "La estructura rítmica de estas piezas revela un pulso terrenal, desprovisto de la rigidez litúrgica y adaptado al movimiento de las cortes señoriales. Los instrumentos de viento y cuerda hacían eco en plazas y callejuelas.",
                        image: {
                            url: "images/14.jpg",
                            caption: "Músicos itinerantes",
                            float: "right"
                        }
                    }
                ]
            },
            {
                title: "Ode to John Williams",
                src: "music/dd.mp3",
                thumbnail: "images/2.jpg", 
                content: [
                    {
                        text: "John Williams spoken-word praise, blending works and music pieces belonging to a common historic cannon.",
                        image: {
                            url: "images/7.jpg",
                            caption: "Walther von der Vogelweide",
                            float: "left"
                        }
                    }
                ]
            },
            {
                title: "Programa III",
                src: "music/dd.mp3",
                thumbnail: "images/3.jpg", 
                content: [
                    {
                        text: "La obra cumbre de Guillaume de Machaut analizada nota a nota. La polifonía del Ars Nova redefine la devoción religiosa a través de un misticismo terrenal y sofisticado."
                    }
                ]
            },
            {
                title: "Programa IV",
                src: "music/dd.mp3",
                thumbnail: "images/4.jpg", 
                content: [
                    {
                        text: "Cantigas de Alfonso X el Sabio. Un puente sonoro entre las culturas cristiana, judía y musulmana de la península ibérica medieval impregnado de lirismo devocional."
                    }
                ]
            },
            {
                title: "Programa V",
                src: "music/dd.mp3",
                thumbnail: "images/5.jpg", 
                content: [
                    {
                        text: "Las visiones místicas convertidas en melodías monofónicas por Hildegard von Bingen. Cantos celestiales que desafiaron los límites de la tesitura vocal de su época."
                    }
                ]
            },
            {
                title: "Programa VI",
                src: "music/dd.mp3",
                thumbnail: "images/7.jpg", 
                content: [
                    {
                        text: "El contrapunto inglés de John Dunstaple y su influencia en el continente. Armonías diáfanas y acordes plenos que anticipaban la llegada del Renacimiento."
                    }
                ]
            },
            {
                title: "Programa VII",
                src: "music/dd.mp3",
                thumbnail: "images/8.jpg", 
                content: [
                    {
                        text: "Estela do dia: la fama de las cantigas marianas analizada desde la perspectiva de la monodia cortesana medieval y los instrumentos de cuerda frotada."
                    }
                ]
            },
            {
                title: "Programa VIII",
                src: "music/dd.mp3",
                thumbnail: "images/9.jpg", 
                content: [
                    {
                        text: "Nuevas variaciones sobre repertorios anónimos de tablatura instrumental antigua. Un ejercicio de arqueología sonora interpretado con criterios históricos."
                    }
                ]
            },
            {
                title: "Programa IX",
                src: "music/dd.mp3",
                thumbnail: "images/10.jpg", 
                content: [
                    {
                        text: "La instrumentación medieval en los manuscritos alfonsíes: cítolas, laudes y fiedles dialogando en una atmósfera de rigurosa contemplación estética."
                    }
                ]
            },
            {
                title: "Programa X",
                src: "music/dd.mp3",
                thumbnail: "images/6.jpg", 
                content: [
                    {
                        text: "El arpa gótica y su papel litúrgico y profano en las cortes centroeuropeas del siglo XIV. El sonido íntimo de la cuerda pulsada sobre caja de madera."
                    }
                ]
            },
            {
                title: "Programa XI",
                src: "music/dd.mp3",
                thumbnail: "images/11.jpg", 
                content: [
                    {
                        text: "Minnesänger y trovadores alemanes: la poesía cantada como vehículo de transmisión cultural, amor cortés y crónica social de los feudos medievales."
                    }
                ]
            },
            {
                title: "Programa XII",
                src: "music/dd.mp3",
                thumbnail: "images/12.jpg", 
                content: [
                    {
                        text: "Clausura del ciclo con el repertorio sacro de abadías y conventos femeninos. El canto llano como forma de meditación atemporal en la penumbra monástica."
                    }
                ]
            }
        ];

        const audioStream = document.getElementById('audio-stream');
        const imageGrid = document.getElementById('image-grid');
        const gallerySection = document.getElementById('gallery-section');
        const detailSection = document.getElementById('detail-section');
        const detailProgramTitle = document.getElementById('detail-program-title');
        const detailContentContainer = document.getElementById('detail-content-container');
        const backToGridBtn = document.getElementById('back-to-grid');
        const mainTitleContainer = document.getElementById('main-title');

        audioStream.volume = 0.8;
        renderImageGrid();
        colorizeRandomLetters();

        function renderImageGrid() {
            imageGrid.innerHTML = '';
            playlist.forEach((track) => {
                const div = document.createElement('div');
                div.classList.add('grid-item');
                div.innerHTML = `<img src="${track.thumbnail}" alt="${track.title}">`;
                
                div.addEventListener('click', () => {
                    audioStream.src = track.src;
                    audioStream.play().catch(err => console.log(err));
                    showDetailView(track);
                });
                
                imageGrid.appendChild(div);
            });
        }

        function showDetailView(track) {
            detailProgramTitle.textContent = track.title;
            detailContentContainer.innerHTML = '';

            track.content.forEach(paragraphData => {
                const p = document.createElement('p');
                p.classList.add('detail-paragraph');
                
                let htmlContent = '';
                
                // Si el párrafo tiene una imagen asociada, se inserta al inicio del párrafo para que el texto la envuelva
                if (paragraphData.image) {
                    const floatClass = paragraphData.image.float === 'right' ? 'float-right' : 'float-left';
                    htmlContent += `
                        <span class="inline-image-block ${floatClass}">
                            <img src="${paragraphData.image.url}" alt="${track.title}">
                            <span class="inline-caption">${paragraphData.image.caption}</span>
                        </span>
                    `;
                }
                
                htmlContent += paragraphData.text;
                p.innerHTML = htmlContent;
                detailContentContainer.appendChild(p);
            });

            gallerySection.style.display = 'none';
            detailSection.classList.add('active');
        }

        function hideDetailView() {
            detailSection.classList.remove('active');
            gallerySection.style.display = 'block';
        }

        function colorizeRandomLetters() {
            const text = "traquetines";
            const colors = ['color-red', 'color-yellow', 'color-green', 'color-blue'];
            
            let htmlContent = '';
            for (let i = 0; i < text.length; i++) {
                htmlContent += `<span class="letter">${text[i]}</span>`;
            }
            mainTitleContainer.innerHTML = htmlContent;

            const letterSpans = Array.from(mainTitleContainer.querySelectorAll('.letter')).filter(span => span.textContent.trim() !== '');

            let chosenIndices = [];
            while (chosenIndices.length < 4 && chosenIndices.length < letterSpans.length) {
                let randomIndex = Math.floor(Math.random() * letterSpans.length);
                if (!chosenIndices.includes(randomIndex)) {
                    chosenIndices.push(randomIndex);
                }
            }

            chosenIndices.forEach((letterIndex, colorIndex) => {
                letterSpans[letterIndex].classList.add(colors[colorIndex]);
            });
        }

        backToGridBtn.addEventListener('click', hideDetailView);

        mainTitleContainer.addEventListener('click', () => {
            hideDetailView();
            colorizeRandomLetters();
        });
    </script>
</body>
</html>
