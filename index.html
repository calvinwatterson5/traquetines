<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>traquetines</title>
    <!-- Fuentes desde Google Fonts: Gótica para títulos y Sans-Serif para lectura -->
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* Reseteo global */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Fondo negro puro absoluto y centrado */
        body {
            font-family: 'MedievalSharp', sans-serif;
            background-color: #000000 !important;
            color: #ffffff !important;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        /* Título Gótico "traquetines" */
        header {
            margin-bottom: 30px;
            text-align: center;
        }

        .gothic-title {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 3.5rem;
            font-weight: normal;
            color: #ffffff;
            letter-spacing: 2px;
            cursor: pointer;
        }

        /* Clases de colores aleatorios para las 4 letras */
        .color-red { color: #ff3333 !important; text-shadow: 0 0 8px rgba(255, 51, 51, 0.4); }
        .color-yellow { color: #ffd700 !important; text-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }
        .color-green { color: #33cc66 !important; text-shadow: 0 0 8px rgba(51, 204, 102, 0.4); }
        .color-blue { color: #3399ff !important; text-shadow: 0 0 8px rgba(51, 153, 255, 0.4); }

        /* Cuadrícula de 12 miniaturas en 2 columnas */
        .gallery-section {
            width: 100%;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .grid-item {
            aspect-ratio: 1 / 1;
            background-color: #0a0a0a;
            border: 1px solid #222222;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: border-color 0.2s, transform 0.2s;
        }

        .grid-item:hover {
            border-color: #ffffff;
            transform: scale(1.03);
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(115%) brightness(90%);
        }

        /* Vista de Detalle del Programa (Oculta por defecto) */
        .detail-view {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        .detail-view.active {
            display: flex;
        }

        /* Título del programa en detalle (Fuente Gótica) */
        .detail-title {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 2.4rem;
            color: #ffffff;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Contenedor principal donde se mezclan párrafos e imágenes */
        .detail-content {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            margin-bottom: 30px;
        }

        /* Estilo de los párrafos de texto (Fuente limpia y legible 'Inter') */
        .detail-paragraph {
            font-family: 'MedievalSharp', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.6;
            color: #cccccc;
            letter-spacing: 0.2px;
            text-align: justify;
            text-justify: inter-word;
        }

        /* Estilo para las imágenes intercaladas a un tamaño menor y elegante */
        .inline-image-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 5px 0;
        }

        .inline-image-block img {
            width: 45%; /* Tamaño notablemente más pequeño e integrado */
            max-width: 150px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border: 1px solid #333333;
            border-radius: 4px;
            filter: contrast(115%) brightness(90%);
            margin-bottom: 6px;
        }

        /* Pie de foto pequeño (Fuente gótica sutil) */
        .inline-caption {
            font-family: 'MedievalSharp', cursive;
            font-size: 0.85rem;
            color: #777777;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* Botón de regreso (Fuente gótica) */
        .back-btn {
            background: transparent;
            border: 1px solid #444444;
            color: #aaaaaa;
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 1.1rem;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
        }

        /* Pie de página con "hecho con irreverencia" (Fuente gótica) */
        footer {
            margin-top: 40px;
            text-align: center;
        }

        .footer-text {
            font-family: 'UnifrakturMaguntia', cursive;
            font-size: 1rem;
            color: #555555;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Título Gótico Principal con letras dinámicas -->
        <header>
            <h1 class="gothic-title" id="main-title">traquetines</h1>
        </header>

        <!-- SECCIÓN 1: Cuadrícula General (12 Programas en 2 columnas) -->
        <section id="gallery-section" class="gallery-section">
            <div id="image-grid" class="image-grid"></div>
        </section>

        <!-- SECCIÓN 2: Vista de Detalle del Programa -->
        <section id="detail-section" class="detail-view">
            <h2 id="detail-program-title" class="detail-title"></h2>
            
            <!-- Contenedor dinámico donde se intercalarán párrafos e imágenes -->
            <div id="detail-content-container" class="detail-content"></div>
            
            <button id="back-to-grid" class="back-btn">← Volver</button>
        </section>

    </div>

    <!-- Pie de página -->
    <footer>
        <p class="footer-text">Hecho con irreverencia</p>
    </footer>

    <!-- Elemento de audio global -->
    <audio id="audio-stream" preload="metadata"></audio>

    <script>
        // Lista de programas con texto (Inter) e imágenes reducidas intercaladas
        const playlist = [
            {
                title: "Programa I",
                src: "music/dd.mp3",
                thumbnail: "images/1.jpg",
                content: [
                    {
                        type: "text",
                        text: "En este primer capítulo exploramos las danzas instrumentales de la baja edad media, donde los juglares recorrían los burgos interpretando estampies a los pies de las murallas."
                    },
                    {
                        src: "images/13.jpg",
                        caption: "Ritter Hiltbolt von Schwangau (Codex Manesse, s. XIV)"
                    },
                    {
                        type: "text",
                        text: "La estructura rítmica de estas piezas revela un pulso terrenal, desprovisto de la rigidez litúrgica y adaptado al movimiento de las cortes señoriales."
                    },
                    {
                        src: "images/14.jpg",
                        caption: "Músicos itinerantes en miniatura alfonsí"
                    }
                ]
            },
            {
                title: "Programa II",
                              src: "music/dd.mp3",
                thumbnail: "images/2.jpg",  content: [
                    {
                        type: "text",
                        text: "Una inmersión profunda en la escuela de Notre-Dame y el organum polifónico. Las catedrales góticas resonaban con estas complejas arquitecturas vocales esculpidas en piedra y aire."
                    },
                    {
                        type: "image",
                        url: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Codex_Manesse_Walther_von_der_Vogelweide.jpg/400px-Codex_Manesse_Walther_von_der_Vogelweide.jpg",
                        caption: "Walther von der Vogelweide"
                    }
                ]
            },
            {
                title: "Programa III",
                              src: "music/dd.mp3",
                thumbnail: "images/3.jpg",  content: [
                    {
                        type: "text",
                        text: "La obra cumbre de Guillaume de Machaut analizada nota a nota. La polifonía del Ars Nova redefine la devoción religiosa a través de un misticismo terrenal y sofisticado."
                    }
                ]
            },
            {
                title: "Programa IV",
                               src: "music/dd.mp3",
                thumbnail: "images/4.jpg",  content: [
                    {
                        type: "text",
                        text: "Cantigas de Alfonso X el Sabio. Un puente sonoro entre las culturas cristiana, judía y musulmana de la península ibérica medieval impregnado de lirismo devocional."
                    }
                ]
            },
            {
                title: "Programa V",
                                src: "music/dd.mp3",
                thumbnail: "images/5.jpg",  content: [
                    {
                        type: "text",
                        text: "Las visiones místicas convertidas en melodías monofónicas por Hildegard von Bingen. Cantos celestiales que desafiaron los límites de la tesitura vocal de su época."
                    }
                ]
            },
            {
                title: "Programa VI",
                             src: "music/dd.mp3",
                thumbnail: "images/6.jpg",   content: [
                    {
                        type: "text",
                        text: "El contrapunto inglés de John Dunstaple y su influencia en el continente. Armonías diáfanas y acordes plenos que anticipaban la llegada del Renacimiento."
                    }
                ]
            },
            {
                title: "Programa VII",
                              src: "music/dd.mp3",
                thumbnail: "images/7.jpg",    content: [
                    {
                        type: "text",
                        text: "Estela do dia: la fama de las cantigas marianas analizada desde la perspectiva de la monodia cortesana medieval y los instrumentos de cuerda frotada."
                    }
                ]
            },
            {
                title: "Programa VIII",
                               src: "music/dd.mp3",
                thumbnail: "images/8.jpg",   content: [
                    {
                        type: "text",
                        text: "Nuevas variaciones sobre repertorios anónimos de tablatura instrumental antigua. Un ejercicio de arqueología sonora interpretado con criterios históricos."
                    }
                ]
            },
            {
                title: "Programa IX",
                               src: "music/dd.mp3",
                thumbnail: "images/9.jpg",  content: [
                    {
                        type: "text",
                        text: "La instrumentación medieval en los manuscritos alfonsíes: cítolas, laudes y fiedles dialogando en una atmósfera de rigurosa contemplación estética."
                    }
                ]
            },
            {
                title: "Programa X",
                              src: "music/dd.mp3",
                thumbnail: "images/10.jpg",  content: [
                    {
                        type: "text",
                        text: "El arpa gótica y su papel litúrgico y profano en las cortes centroeuropeas del siglo XIV. El sonido íntimo de la cuerda pulsada sobre caja de madera."
                    }
                ]
            },
            {
                title: "Programa XI",
                              src: "music/dd.mp3",
                thumbnail: "images/11.jpg",  content: [
                    {
                        type: "text",
                        text: "Minnesänger y trovadores alemanes: la poesía cantada como vehículo de transmisión cultural, amor cortés y crónica social de los feudos medievales."
                    }
                ]
            },
            {
                title: "Programa XII",
                            src: "music/dd.mp3",
                thumbnail: "images/12.jpg",    content: [
                    {
                        type: "text",
                        text: "Clausura del ciclo con el repertorio sacro de abadías y conventos femeninos. El canto llano como forma de meditación atemporal en la penumbra monástica."
                    }
                ]
            }
        ];

        const audioStream = document.getElementById('audio-stream');
        const imageGrid = document.getElementById('image-grid');
        const gallerySection = document.getElementById('gallery-section');
        const detailSection = document.getElementById('detail-section');
        const detailProgramTitle = document.getElementById('detail-program-title');
        const detailContentContainer = document.getElementById('detail-content-container');
        const backToGridBtn = document.getElementById('back-to-grid');
        const mainTitleContainer = document.getElementById('main-title');

        audioStream.volume = 0.8;
        renderImageGrid();
        colorizeRandomLetters();

        function renderImageGrid() {
            imageGrid.innerHTML = '';
            playlist.forEach((track) => {
                const div = document.createElement('div');
                div.classList.add('grid-item');
                div.innerHTML = `<img src="${track.thumbnail}" alt="${track.title}">`;
                
                div.addEventListener('click', () => {
                    audioStream.src = track.src;
                    audioStream.play().catch(err => console.log(err));
                    showDetailView(track);
                });
                
                imageGrid.appendChild(div);
            });
        }

        function showDetailView(track) {
            detailProgramTitle.textContent = track.title;
            detailContentContainer.innerHTML = '';

            track.content.forEach(block => {
                if (block.type === 'text') {
                    const p = document.createElement('p');
                    p.classList.add('detail-paragraph');
                    p.textContent = block.text;
                    detailContentContainer.appendChild(p);
                } else if (block.type === 'image') {
                    const imgDiv = document.createElement('div');
                    imgDiv.classList.add('inline-image-block');
                    imgDiv.innerHTML = `
                        <img src="${block.url}" alt="${track.title}">
                        <p class="inline-caption">${block.caption}</p>
                    `;
                    detailContentContainer.appendChild(imgDiv);
                }
            });

            gallerySection.style.display = 'none';
            detailSection.classList.add('active');
        }

        function hideDetailView() {
            detailSection.classList.remove('active');
            gallerySection.style.display = 'block';
        }

        function colorizeRandomLetters() {
            const text = "traquetines";
            const colors = ['color-red', 'color-yellow', 'color-green', 'color-blue'];
            
            let htmlContent = '';
            for (let i = 0; i < text.length; i++) {
                htmlContent += `<span class="letter">${text[i]}</span>`;
            }
            mainTitleContainer.innerHTML = htmlContent;

            const letterSpans = Array.from(mainTitleContainer.querySelectorAll('.letter')).filter(span => span.textContent.trim() !== '');

            let chosenIndices = [];
            while (chosenIndices.length < 4 && chosenIndices.length < letterSpans.length) {
                let randomIndex = Math.floor(Math.random() * letterSpans.length);
                if (!chosenIndices.includes(randomIndex)) {
                    chosenIndices.push(randomIndex);
                }
            }

            chosenIndices.forEach((letterIndex, colorIndex) => {
                letterSpans[letterIndex].classList.add(colors[colorIndex]);
            });
        }

        backToGridBtn.addEventListener('click', hideDetailView);

        mainTitleContainer.addEventListener('click', () => {
            hideDetailView();
            colorizeRandomLetters();
        });
    </script>
</body>
</html>
